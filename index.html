<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Profile links for Dr. Jan Voges.">
		<meta name="theme-color" content="#f4f6f5">
		<link rel="icon" type="image/x-icon" href="favicon.ico">
		<title>Dr. Jan Voges</title>
		<style>
			:root {
				color-scheme: light;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				font-synthesis: none;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				--background: #f4f6f5;
				--foreground: #18221f;
				--accent: #176b58;
				--rule: #d5ded9;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				padding: 2rem;
				background: var(--background);
				color: var(--foreground);
				display: grid;
				place-items: center;
			}

			main {
				width: min(100%, 28rem);
			}

			.logo {
				display: block;
				width: auto;
				max-width: 100%;
				max-height: 6rem;
				margin-bottom: 1.5rem;
				object-fit: contain;
				object-position: left center;
			}

			h1 {
				margin: 0 0 2rem;
				font-size: 2.5rem;
				font-weight: 600;
				line-height: 1.1;
			}

			nav ul {
				margin: 0;
				padding: 0;
				border-top: 1px solid var(--rule);
				list-style: none;
			}

			nav li {
				border-bottom: 1px solid var(--rule);
			}

			nav a {
				display: block;
				padding: 1rem 0;
				color: var(--foreground);
				font-size: 1.125rem;
				text-decoration: none;
				transition: color 160ms ease;
			}

			nav a:hover,
			nav a:focus-visible {
				color: var(--accent);
			}

			nav a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 4px;
			}

			@media (prefers-reduced-motion: reduce) {
				*, *::before, *::after {
					transition-duration: 0.01ms !important;
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
				}
			}

			@media (max-width: 480px) {
				body {
					padding: 1.5rem;
				}

				h1 {
					font-size: 2rem;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img class="logo" src="bioailab-logo.png" alt="BioAI Lab logo">
			<h1>Dr. Jan Voges</h1>
			<nav aria-label="Profile links">
				<ul>
					<li><a rel="me" href="https://www.linkedin.com/in/jan-voges/">LinkedIn</a></li>
					<li><a rel="me" href="https://github.com/voges">GitHub</a></li>
					<li><a rel="me" href="https://scholar.google.com/citations?user=Ua2KT5sAAAAJ">Google Scholar</a></li>
					<li><a rel="me" href="https://orcid.org/0000-0002-6080-660X">ORCID</a></li>
				</ul>
			</nav>
		</main>
	</body>
</html>
